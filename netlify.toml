[build]
  # CRUCIAL: Set base to empty string so Netlify can see your lobby files at the git root
  base = ""
  
  # Tell Netlify to go inside the monorepo folder, run pnpm install, and run the filter build
  command = "cd edu-portals/myPAW && pnpm install && pnpm build"
  
  # CRUCIAL: Change publish to the root folder. 
  # Your pnpm build script needs to move its finished files into this path (see Step 2)
  publish = "."

[[redirects]]
  # Route deep browser refreshes (like /profile) straight to the app's index file
  from = "/edu-portals/myPAW/*"
  to = "/edu-portals/myPAW/index.html"
  status = 200
