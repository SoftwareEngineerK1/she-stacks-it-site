[build]
  # This forces Netlify to enter the subfolder from the Git root
  base = "edu-portals/myPAW"
  
  # This executes your filtered workspace pnpm script
  command = "pnpm install && pnpm build"
  
  # This overrides the UI and sets the absolute build path relative to the base directory
  publish = "01_Presentation-Layer/Multi-System/Browser-System/web-apps/web-public/dist"

[functions]
  # This overrides the functions path relative to the base directory
  directory = "netlify/functions"

[[redirects]]
  # This routes all client-side navigation paths straight to your compiled index layout
  from = "/*"
  to = "/index.html"
  status = 200
